# Local development entry point.
# Edit weatherslim-base.yaml for all config changes.

substitutions:
  wifi_ssid: !secret wifi_ssid
  wifi_password: !secret wifi_password

packages:
  base: !include weatherslim-base.yaml

external_components:
  - source:
      type: local
      path: components/
    components: [ waveshare_7in5h ]
